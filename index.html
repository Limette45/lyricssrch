<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics Tracker</title>
<style>
:root {
    --bg: #f2f7fa;
    --surface: #ffffff;
    --surface-alt: #eaf4f9;
    --text: #263746;
    --muted: #718391;
    --border: #d8e7ef;
    --blue: #8dcfe8;
    --blue-dark: #347d9d;
    --blue-hover: #d9eff9;
    --danger: #d87979;
}

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    max-width: 850px;
    margin: 0 auto;
    padding: 22px;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
}

h1 {
    font-size: 27px;
    margin: 0;
}

h2 {
    font-size: 19px;
    margin: 0 0 14px;
}

p {
    margin-top: 8px;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
    padding: 8px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    background: var(--surface);
    transition: background 0.15s, border-color 0.15s;
}

button:hover:not(:disabled) {
    background: var(--blue-hover);
    border-color: var(--blue);
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.45;
}

.primary-button {
    background: #bce6f6;
    border-color: #a3d9ee;
    color: #244b60;
    font-weight: 600;
}

.primary-button:hover:not(:disabled) {
    background: #a6ddf1;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

section {
    margin-bottom: 28px;
}

#random-section {
    padding: 18px;
    background: #e5f3fa;
    border: 1px solid #cce5f1;
    border-radius: 12px;
}

#random-section h2 {
    margin-bottom: 8px;
}

.remaining {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 14px;
}

#random-button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
}

#random-result {
    margin-top: 14px;
}

#random-result:empty {
    display: none;
}

.random-card {
    background: var(--surface);
    border: 1px solid #c9e2ef;
    border-radius: 10px;
    padding: 15px;
}

.random-card .song-title {
    font-size: 18px;
}

.random-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.random-actions button {
    flex: 1;
}

.skip-button {
    color: #8d5353;
    border-color: #ebd1d1;
}

.song-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.song {
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.song-title {
    font-weight: 600;
    overflow-wrap: anywhere;
    margin-bottom: 11px;
}

.song-controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}

.checked-label {
    color: var(--muted);
    font-size: 13px;
}

.count {
    min-width: 24px;
    text-align: center;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.lyrics-button {
    margin-left: auto;
    background: #e0f2fa;
    border-color: #c6e7f5;
    color: #286b89;
}

.lyrics-button:hover:not(:disabled) {
    background: #ccebf8;
}

/* Artist colors */
.artist-bad-bunny {
    color: #d84444;
}

.artist-j-balvin {
    color: #29945b;
}

.artist-ozuna {
    color: #858b94;
}

.artist-farruko {
    color: #28a5d2;
}

.artist-arcangel {
    color: #c49a13;
}

#upload-section {
    margin-top: 55px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
}

#file-input {
    display: block;
    width: 100%;
    margin: 14px 0;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
}

#file-status, .subtext {
    color: var(--muted);
    font-size: 14px;
    overflow-wrap: anywhere;
}

.empty-message {
    color: var(--muted);
    padding: 16px 0;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.history-number {
    color: var(--blue-dark);
    font-weight: 700;
    min-width: 25px;
}

.history-title {
    flex: 1;
    overflow-wrap: anywhere;
    font-weight: 600;
}

.history-date {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
}

.hidden {
    display: none !important;
}

@media (max-width: 480px) {
    body {
        padding: 14px;
    }

    .page-header {
        align-items: flex-start;
    }

    .song {
        padding: 12px;
    }

    .random-card .song-title {
        font-size: 16px;
    }
}
</style>
</head>
<body>

<div class="page-header">
    <h1 id="page-title">Lyrics Tracker</h1>
    <div class="header-actions">
        <button id="tracker-nav" class="hidden">Tracker</button>
        <button id="history-nav">History</button>
    </div>
</div>

<main id="tracker-page">

    <section id="random-section">
        <h2>Random Choose</h2>
        <p id="remaining" class="remaining">0 remaining</p>
        <button id="random-button" class="primary-button" disabled>
            Choose Random Song
        </button>
        <div id="random-result"></div>
    </section>

    <section>
        <h2>Song List</h2>
        <div id="song-list" class="song-list">
            <p class="empty-message">Load a TXT file to get started.</p>
        </div>
    </section>

    <section id="upload-section">
        <h2>Load TXT File</h2>
        <p class="subtext">Select a text file containing one song per line.</p>
        <input type="file" id="file-input" accept=".txt,text/plain">
        <p id="file-status">No file loaded.</p>
    </section>

</main>

<main id="history-page" class="hidden">
    <section>
        <h2>Random Selection History</h2>
        <p class="subtext">
            Songs are recorded when selected. Skipped songs are not included.
        </p>
        <div id="history-list" class="history-list"></div>
    </section>
</main>

<script>
const STORAGE_KEY = "lyricsTrackerInventory_v1";

let songs = [];
let selectedSongIds = new Set();
let randomSongId = null;
let history = [];
let nextSongId = 1;

const songList = document.getElementById("song-list");
const remainingDisplay = document.getElementById("remaining");
const randomButton = document.getElementById("random-button");
const randomResult = document.getElementById("random-result");
const fileInput = document.getElementById("file-input");
const fileStatus = document.getElementById("file-status");
const historyList = document.getElementById("history-list");

const trackerPage = document.getElementById("tracker-page");
const historyPage = document.getElementById("history-page");
const pageTitle = document.getElementById("page-title");
const trackerNav = document.getElementById("tracker-nav");
const historyNav = document.getElementById("history-nav");

function cleanDisplayTitle(title) {
    return title
        // Remove bracketed content, including the brackets.
        .replace(/\([^()]*\)|\[[^\[\]]*\]|\{[^{}]*\}|（[^（）]*）|［[^［］]*］|｛[^｛｝]*｝/g, " ")
        // Remove official video/audio labels, ignoring letter case.
        .replace(/\bofficial\s+music\s+video\b/gi, "")
        .replace(/\bofficial\s+video\b/gi, "")
        .replace(/\bvideo\s+oficial\b/gi, "")
        .replace(/\baudio\s+oficial\b/gi, "")
        // Remove repeated spaces left behind.
        .replace(/\s+/g, " ")
        .trim();
}

function saveSongs() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            songs,
            selectedSongIds: [...selectedSongIds],
            randomSongId,
            history,
            nextSongId
        }));
    } catch (error) {
        fileStatus.textContent =
            "Unable to save data. Browser storage may be full or unavailable.";
    }
}

function loadSavedData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            render();
            renderHistory();
            return;
        }

        const data = JSON.parse(saved);

        songs = Array.isArray(data.songs) ? data.songs : [];
        selectedSongIds = new Set(data.selectedSongIds || []);
        randomSongId = data.randomSongId ?? null;
        history = Array.isArray(data.history) ? data.history : [];
        nextSongId = data.nextSongId || 1;

        render();
        renderHistory();

        if (songs.length > 0) {
            fileStatus.textContent =
                "Restored " + songs.length + " saved songs.";
        }
    } catch (error) {
        songs = [];
        selectedSongIds = new Set();
        randomSongId = null;
        history = [];
        nextSongId = 1;
        render();
        renderHistory();
    }
}

function addColoredArtistNames(element, title) {
    const artistPattern =
        /(bad bunny|j balvin|ozuna|farruko|arcángel|arcangel)/gi;

    const colorClasses = {
        "bad bunny": "artist-bad-bunny",
        "j balvin": "artist-j-balvin",
        "ozuna": "artist-ozuna",
        "farruko": "artist-farruko",
        "arcángel": "artist-arcangel",
        "arcangel": "artist-arcangel"
    };

    let lastIndex = 0;
    let match;

    while ((match = artistPattern.exec(title)) !== null) {
        element.append(
            document.createTextNode(title.slice(lastIndex, match.index))
        );

        const span = document.createElement("span");
        span.className = colorClasses[match[0].toLowerCase()];
        span.textContent = match[0];
        element.append(span);

        lastIndex = match.index + match[0].length;
    }

    element.append(document.createTextNode(title.slice(lastIndex)));
}

function makeSongCard(song) {
    const card = document.createElement("article");
    card.className = "song";

    const title = document.createElement("div");
    title.className = "song-title";
    addColoredArtistNames(title, song.displayTitle);

    const controls = document.createElement("div");
    controls.className = "song-controls";

    const label = document.createElement("span");
    label.className = "checked-label";
    label.textContent = "Checked";

    const minus = document.createElement("button");
    minus.type = "button";
    minus.textContent = "−";
    minus.setAttribute("aria-label", "Decrease checked count");
    minus.disabled = song.checked <= 1;

    const count = document.createElement("span");
    count.className = "count";
    count.textContent = song.checked;

    const plus = document.createElement("button");
    plus.type = "button";
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Increase checked count");

    minus.addEventListener("click", () => {
        if (song.checked > 1) {
            song.checked--;
            saveSongs();
            render();
        }
    });

    plus.addEventListener("click", () => {
        song.checked++;
        saveSongs();
        render();
    });

    const lyrics = document.createElement("button");
    lyrics.type = "button";
    lyrics.className = "lyrics-button";
    lyrics.textContent = "Lyrics";

    lyrics.addEventListener("click", () => {
        const query = song.originalTitle + " genius lyrics";
        const url = "https://www.google.com/search?q=" +
            encodeURIComponent(query);

        window.open(url, "_blank", "noopener,noreferrer");
    });

    controls.append(label, minus, count, plus, lyrics);
    card.append(title, controls);

    return card;
}

function render() {
    songList.replaceChildren();

    if (songs.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "Load a TXT file to get started.";
        songList.append(empty);
    } else {
        songs.forEach(song => songList.append(makeSongCard(song)));
    }

    const remaining = songs.filter(
        song => !selectedSongIds.has(song.id)
    ).length;

    remainingDisplay.textContent = remaining + " remaining";
    randomButton.disabled = remaining === 0;

    randomResult.replaceChildren();

    if (randomSongId !== null) {
        const chosenSong = songs.find(song => song.id === randomSongId);

        if (chosenSong) {
            const card = document.createElement("div");
            card.className = "random-card";
            card.append(makeSongCard(chosenSong));

            const actions = document.createElement("div");
            actions.className = "random-actions";

            const skip = document.createElement("button");
            skip.type = "button";
            skip.className = "skip-button";
            skip.textContent = "Skip";

            skip.addEventListener("click", () => {
                // Undo the current selection and remove it from history.
                selectedSongIds.delete(chosenSong.id);

                const lastIndex = history.findLastIndex
                    ? history.findLastIndex(item =>
                        item.songId === chosenSong.id
                    )
                    : (() => {
                        for (let i = history.length - 1; i >= 0; i--) {
                            if (history[i].songId === chosenSong.id) return i;
                        }
                        return -1;
                    })();

                if (lastIndex !== -1) {
                    history.splice(lastIndex, 1);
                }

                randomSongId = null;
                saveSongs();
                render();
                renderHistory();
            });

            const next = document.createElement("button");
            next.type = "button";
            next.className = "primary-button";
            next.textContent = "Choose Next";

            next.addEventListener("click", chooseRandomSong);

            actions.append(skip, next);
            card.append(actions);
            randomResult.append(card);
        }
    }
}

function chooseRandomSong() {
    const availableSongs = songs.filter(
        song => !selectedSongIds.has(song.id)
    );

    if (availableSongs.length === 0) {
        randomSongId = null;
        saveSongs();
        render();
        return;
    }

    const index = Math.floor(Math.random() * availableSongs.length);
    const chosenSong = availableSongs[index];

    selectedSongIds.add(chosenSong.id);
    randomSongId = chosenSong.id;

    history.push({
        songId: chosenSong.id,
        title: chosenSong.displayTitle,
        timestamp: new Date().toISOString()
    });

    saveSongs();
    render();
    renderHistory();
}

function renderHistory() {
    historyList.replaceChildren();

    if (history.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "No selection history yet.";
        historyList.append(empty);
        return;
    }

    [...history].reverse().forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "history-item";

        const number = document.createElement("span");
        number.className = "history-number";
        number.textContent = history.length - index + ".";

        const content = document.createElement("div");
        content.className = "history-title";
        addColoredArtistNames(content, item.title);

        const date = document.createElement("span");
        date.className = "history-date";

        const parsedDate = new Date(item.timestamp);
        date.textContent = Number.isNaN(parsedDate.getTime())
            ? ""
            : parsedDate.toLocaleString();

        content.append(date);
        row.append(number, content);
        historyList.append(row);
    });
}

function showPage(page) {
    const isHistory = page === "history";

    trackerPage.classList.toggle("hidden", isHistory);
    historyPage.classList.toggle("hidden", !isHistory);

    trackerNav.classList.toggle("hidden", !isHistory);
    historyNav.classList.toggle("hidden", isHistory);

    pageTitle.textContent = isHistory ? "History" : "Lyrics Tracker";
    document.title = isHistory ? "History - Lyrics Tracker" : "Lyrics Tracker";

    const url = new URL(window.location.href);
    if (isHistory) {
        url.searchParams.set("page", "history");
    } else {
        url.searchParams.delete("page");
    }

    window.history.replaceState({}, "", url);
    window.scrollTo(0, 0);
}

historyNav.addEventListener("click", () => showPage("history"));
trackerNav.addEventListener("click", () => showPage("tracker"));

fileInput.addEventListener("change", event => {
    const file = event.target.files[0];
    if (!file) return;

    if (!file.name.toLowerCase().endsWith(".txt")) {
        fileStatus.textContent = "Please select a TXT file.";
        fileInput.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        const text = String(reader.result ?? "");

        const titles = text
            .replace(/^\uFEFF/, "")
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0);

        if (titles.length === 0) {
            fileStatus.textContent = "No songs found in the file.";
            fileInput.value = "";
            return;
        }

        songs = titles.map(title => ({
            id: nextSongId++,
            originalTitle: title,
            displayTitle: cleanDisplayTitle(title),
            checked: 1
        }));

        selectedSongIds = new Set();
        randomSongId = null;
        history = [];

        saveSongs();
        render();
        renderHistory();

        fileStatus.textContent =
            "Loaded " + songs.length + " songs from " + file.name + ".";

        fileInput.value = "";
        showPage("tracker");
    };

    reader.onerror = () => {
        fileStatus.textContent = "Unable to read the file.";
        fileInput.value = "";
    };

    reader.readAsText(file);
});

loadSavedData();

if (new URLSearchParams(window.location.search).get("page") === "history") {
    showPage("history");
}
</script>

</body>
</html>

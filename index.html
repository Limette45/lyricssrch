<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics Tracker</title>
<style>
:root {
    --bg: #f4f1eb;
    --surface: #ffffff;
    --text: #2f3038;
    --muted: #6e6f78;
    --border: #e2dcd3;
    --purple: #6f5f9e;
    --blue: #5a7599;
    --terracotta: #b56e5c;
    --green: #5d8470;
}
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 20px 14px 36px;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
}
.app {
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
}
h1 {
    margin: 5px 0 20px;
    text-align: center;
    font-size: 30px;
    line-height: 1.25;
}
h2 {
    margin: 0;
    font-size: 21px;
}
.panel {
    margin-bottom: 16px;
    padding: 17px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(45, 40, 35, 0.04);
}
.tabs {
    display: flex;
    gap: 9px;
    margin-bottom: 18px;
}
button, .file-label {
    min-height: 40px;
    padding: 10px 15px;
    border: 0;
    border-radius: 10px;
    background: var(--blue);
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}
button:hover, .file-label:hover {
    filter: brightness(.94);
}
button:active {
    transform: translateY(1px);
}
.tab {
    flex: 1;
    background: #e8e3db;
    color: var(--text);
}
.tab.active, .primary {
    background: var(--purple);
    color: white;
}
.secondary {
    background: #7a7671;
}
.skip {
    background: var(--terracotta);
}
.success {
    background: var(--green);
}
.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 13px;
}
.count {
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
}
.random-title {
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
}
.random-result {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 76px;
    padding: 15px 4px;
    text-align: center;
    font-size: 21px;
    font-weight: 750;
    line-height: 1.4;
    overflow-wrap: anywhere;
    word-break: normal;
}
.random-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 8px;
}
.song-list, .history-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}
.song-item {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    min-width: 0;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
}
.song-name {
    width: 100%;
    min-width: 0;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    overflow-wrap: anywhere;
    word-break: normal;
}
.song-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    min-width: 0;
}
.counter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.counter button {
    min-width: 40px;
    min-height: 38px;
    padding: 7px 12px;
    font-size: 18px;
}
.counter-value {
    min-width: 22px;
    text-align: center;
    font-size: 17px;
    font-weight: 800;
}
.lyrics-button {
    min-height: 36px;
    padding: 8px 13px;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
    background: var(--blue);
}
.artist-bad-bunny { color: #bd4b4b; }
.artist-j-balvin { color: #56825d; }
.artist-ozuna { color: #777782; }
.artist-farruko { color: #5489b4; }
.artist-arcangel { color: #b38a36; }
.history-item {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    min-width: 0;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
}
.history-name {
    min-width: 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    overflow-wrap: anywhere;
}
.history-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    width: 100%;
}
.empty-state {
    padding: 24px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
}
.upload-area {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 11px;
}
.upload-description {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}
.file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--green);
}
input[type="file"] {
    display: none;
}
.status {
    min-height: 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
}
.hidden {
    display: none !important;
}
@media (min-width: 600px) {
    .song-item, .history-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
    }
    .song-name, .history-name {
        font-size: 20px;
    }
    .song-actions, .history-actions {
        width: auto;
    }
}
@media (max-width: 380px) {
    body {
        padding: 14px 9px 28px;
    }
    .panel {
        padding: 13px;
    }
    h1 {
        font-size: 27px;
    }
    .random-result {
        font-size: 19px;
    }
    .song-name {
        font-size: 18px;
    }
    .counter {
        gap: 7px;
    }
    .counter button {
        min-width: 36px;
        padding: 7px 10px;
    }
}
</style>
</head>
<body>
<div class="app">
    <h1>Lyrics Tracker</h1>

    <div class="tabs">
        <button class="tab active" data-action="show-songs">Songs</button>
        <button class="tab" data-action="show-history">History</button>
    </div>

    <main id="songs-page">
        <section class="panel">
            <div class="random-title">Random Choose</div>
            <div class="random-result" id="random-result">Choose a song to get started</div>
            <div class="random-actions">
                <button class="primary" data-action="choose-random">Choose Random</button>
                <button class="skip" data-action="skip-current">Skip</button>
            </div>
            <div class="count" id="remaining-count" style="text-align:center;margin-top:12px">
                0 songs remaining
            </div>
        </section>

        <section class="panel">
            <div class="section-heading">
                <h2>Songs</h2>
                <span class="count" id="song-count">0 songs</span>
            </div>
            <div id="song-list" class="song-list">
                <div class="empty-state">No songs loaded yet.</div>
            </div>
        </section>

        <section class="panel">
            <div class="section-heading">
                <h2>Import Songs</h2>
            </div>
            <div class="upload-area">
                <p class="upload-description">
                    Upload a TXT file with one song title per line. Loading a new file replaces the current song list.
                </p>
                <label class="file-label" for="txt-file">Choose TXT File</label>
                <input id="txt-file" type="file" accept=".txt,text/plain">
                <div id="upload-status" class="status"></div>
            </div>
        </section>
    </main>

    <main id="history-page" class="hidden">
        <section class="panel">
            <div class="section-heading">
                <h2>History</h2>
                <span class="count" id="history-count">0 songs</span>
            </div>
            <div id="history-list" class="history-list">
                <div class="empty-state">No songs chosen yet.</div>
            </div>
        </section>
    </main>
</div>

<script>
const STORAGE_KEY = "lyricsTrackerInventory_v1";

const elements = {
    songsPage: document.getElementById("songs-page"),
    historyPage: document.getElementById("history-page"),
    songList: document.getElementById("song-list"),
    songCount: document.getElementById("song-count"),
    historyList: document.getElementById("history-list"),
    historyCount: document.getElementById("history-count"),
    randomResult: document.getElementById("random-result"),
    remainingCount: document.getElementById("remaining-count"),
    txtFile: document.getElementById("txt-file"),
    uploadStatus: document.getElementById("upload-status")
};

let songs = [];
let history = [];
let nextSongId = 1;
let currentRandomId = null;
let currentPage = "songs";

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            songs, history, nextSongId, currentRandomId
        }));
    } catch (error) {
        console.warn("Unable to save tracker state.", error);
    }
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const data = JSON.parse(raw);
        songs = Array.isArray(data.songs) ? data.songs : [];
        history = Array.isArray(data.history) ? data.history : [];
        nextSongId = Math.max(
            Number(data.nextSongId) || 1,
            ...songs.map(song => Number(song.id) + 1 || 1),
            1
        );
        currentRandomId = data.currentRandomId ?? null;
    } catch (error) {
        songs = [];
        history = [];
        nextSongId = 1;
        currentRandomId = null;
    }
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function removeBracketedText(value) {
    const pairs = {
        "(": ")", "[": "]", "{": "}",
        "（": "）", "［": "］", "｛": "｝"
    };
    const closing = new Set(Object.values(pairs));
    const stack = [];
    let result = "";

    for (const char of value) {
        if (pairs[char]) {
            stack.push(pairs[char]);
            continue;
        }
        if (closing.has(char)) {
            if (stack.length && stack[stack.length - 1] === char) {
                stack.pop();
            }
            continue;
        }
        if (stack.length === 0) result += char;
    }
    return result;
}

function cleanTitle(value) {
    return removeBracketedText(value)
        .replace(/\b(official\s+music\s+video|official\s+video|video\s+oficial|audio\s+oficial)\b/gi, "")
        .replace(/\s+/g, " ")
        .trim();
}

function displayTitle(value) {
    const cleaned = cleanTitle(value) || value;
    let title = escapeHTML(cleaned);

    const artistRules = [
        [/\bBad Bunny\b/i, "artist-bad-bunny"],
        [/\bJ Balvin\b/i, "artist-j-balvin"],
        [/\bOzuna\b/i, "artist-ozuna"],
        [/\bFarruko\b/i, "artist-farruko"],
        [/\bArc[aá]ngel\b/i, "artist-arcangel"]
    ];

    for (const [pattern, className] of artistRules) {
        const match = cleaned.match(pattern);
        if (match) {
            const safeArtist = escapeHTML(match[0]);
            const escapedPattern = safeArtist.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            title = title.replace(
                new RegExp(escapedPattern, "i"),
                `<span class="${className}">${safeArtist}</span>`
            );
        }
    }
    return title;
}

function getRemainingSongs() {
    const usedIds = new Set(history.map(item => item.songId));
    return songs.filter(song => !usedIds.has(song.id));
}

function renderSongActions(song) {
    return `
        <div class="song-actions">
            <div class="counter">
                <button data-action="decrement" data-id="${song.id}" aria-label="Decrease count">−</button>
                <span class="counter-value">${song.checked}</span>
                <button data-action="increment" data-id="${song.id}" aria-label="Increase count">+</button>
            </div>
            <button class="lyrics-button" data-action="lyrics" data-id="${song.id}">Lyrics</button>
        </div>
    `;
}

function renderSongs() {
    elements.songCount.textContent = `${songs.length} songs`;

    if (songs.length === 0) {
        elements.songList.innerHTML =
            '<div class="empty-state">No songs loaded yet.</div>';
        renderRemainingCount();
        return;
    }

    elements.songList.innerHTML = songs.map(song => `
        <div class="song-item">
            <div class="song-name">${displayTitle(song.title)}</div>
            ${renderSongActions(song)}
        </div>
    `).join("");

    renderRemainingCount();
}

function renderRemainingCount() {
    elements.remainingCount.textContent =
        `${getRemainingSongs().length} songs remaining`;
}

function renderRandomResult() {
    const song = songs.find(item => item.id === currentRandomId);

    if (!song) {
        elements.randomResult.textContent =
            songs.length ? "Choose a song" : "Choose a song to get started";
    } else {
        elements.randomResult.innerHTML = displayTitle(song.title);
    }
    renderRemainingCount();
}

function renderHistory() {
    elements.historyCount.textContent = `${history.length} songs`;

    if (history.length === 0) {
        elements.historyList.innerHTML =
            '<div class="empty-state">No songs chosen yet.</div>';
        return;
    }

    elements.historyList.innerHTML = [...history].reverse().map(item => {
        const song = songs.find(entry => entry.id === item.songId);
        const title = song ? song.title : item.title;

        return `
            <div class="history-item">
                <div class="history-name">${displayTitle(title)}</div>
                <div class="history-actions">
                    <button class="lyrics-button" data-action="lyrics" data-id="${item.songId}">Lyrics</button>
                    <button class="skip" data-action="skip" data-id="${item.songId}">Skip</button>
                </div>
            </div>
        `;
    }).join("");
}

function renderAll() {
    renderSongs();
    renderRandomResult();
    renderHistory();
    updateTabs();
}

function updateTabs() {
    document.querySelectorAll(".tab").forEach(tab => {
        const isSongs = tab.dataset.action === "show-songs";
        tab.classList.toggle(
            "active",
            (currentPage === "songs" && isSongs) ||
            (currentPage === "history" && !isSongs)
        );
    });

    elements.songsPage.classList.toggle("hidden", currentPage !== "songs");
    elements.historyPage.classList.toggle("hidden", currentPage !== "history");
}

function chooseRandomSong() {
    const available = getRemainingSongs();

    if (available.length === 0) {
        currentRandomId = null;
        renderRandomResult();
        elements.randomResult.textContent = songs.length
            ? "All songs have been chosen!"
            : "Upload a TXT file first";
        saveState();
        return;
    }

    const index = Math.floor(Math.random() * available.length);
    const song = available[index];

    currentRandomId = song.id;
    history.push({
        songId: song.id,
        title: song.title,
        chosenAt: Date.now()
    });

    renderAll();
    saveState();
}

function changeCheckedCount(id, change) {
    const song = songs.find(item => item.id === id);
    if (!song) return;

    song.checked = Math.max(0, (Number(song.checked) || 0) + change);
    renderSongs();
    saveState();
}

function openLyrics(id) {
    const song = songs.find(item => item.id === id);
    const historyItem = history.find(item => item.songId === id);
    const title = song?.title || historyItem?.title;

    if (!title) return;

    const query = `${cleanTitle(title)} genius lyrics`;
    window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank",
        "noopener,noreferrer"
    );
}

function skipSong(id) {
    const index = history.findIndex(item => item.songId === id);
    if (index === -1) return;

    history.splice(index, 1);

    if (currentRandomId === id) currentRandomId = null;

    renderAll();
    saveState();
}

function importTextFile(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
        const lines = String(reader.result || "")
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(Boolean);

        const uniqueTitles = [];
        const seen = new Set();

        for (const line of lines) {
            const key = cleanTitle(line).toLowerCase();
            if (!key || seen.has(key)) continue;

            seen.add(key);
            uniqueTitles.push(line);
        }

        songs = uniqueTitles.map(title => ({
            id: nextSongId++,
            title,
            checked: 1
        }));

        history = [];
        currentRandomId = null;

        elements.uploadStatus.textContent =
            `Loaded ${songs.length} songs.`;

        renderAll();
        saveState();
    };

    reader.onerror = () => {
        elements.uploadStatus.textContent = "Unable to read this file.";
    };

    reader.readAsText(file);
}

document.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const action = button.dataset.action;
    const id = Number(button.dataset.id);

    switch (action) {
        case "show-songs":
            currentPage = "songs";
            updateTabs();
            break;

        case "show-history":
            currentPage = "history";
            updateTabs();
            break;

        case "choose-random":
            chooseRandomSong();
            break;

        case "skip-current":
            skipSong(currentRandomId);
            break;

        case "increment":
            changeCheckedCount(id, 1);
            break;

        case "decrement":
            changeCheckedCount(id, -1);
            break;

        case "lyrics":
            openLyrics(id);
            break;

        case "skip":
            skipSong(id);
            break;
    }
});

elements.txtFile.addEventListener("change", event => {
    importTextFile(event.target.files[0]);
    event.target.value = "";
});

loadState();
renderAll();
</script>
</body>
</html>
